set -g mouse on                   # Enable mouse support
set -g history-limit 10000        # Panjang scrollback
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB,xterm-kitty:RGB"  # truecolor untuk warna hex
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Lebih mudah split
bind | split-window -h
bind - split-window -v

# Gunakan vi keybindings di mode copy
setw -g mode-keys vi

# Status bar minimal
set -g status-left-length 30
set -g status-right-length 100
set -g status-interval 5

# Tema: Catppuccin Mocha + ember #e9684e, sama dengan rice GNOME.
# Sesi = pill ember (seperti island jam), window aktif = pill gelap.
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-justify left
set -g status-left "#[fg=#e9684e,bg=#181825]#[fg=#1e1e2e,bg=#e9684e,bold] #S #[fg=#e9684e,bg=#181825,nobold] "
set -g status-right "#[fg=#6c7086] %a %d %b #[fg=#a6adc8]%H:%M "
setw -g window-status-format " #[fg=#6c7086]#I #[fg=#a6adc8]#W "
setw -g window-status-current-format "#[fg=#313244,bg=#181825]#[fg=#e9684e,bg=#313244,bold]#I #[fg=#cdd6f4]#W#[fg=#313244,bg=#181825,nobold]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#e9684e"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#e9684e,fg=#1e1e2e"
set -g display-panes-active-colour "#e9684e"
set -g display-panes-colour "#585b70"
setw -g clock-mode-colour "#e9684e"

#set -g mouse off

set-option -g set-clipboard on
